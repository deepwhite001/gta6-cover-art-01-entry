<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Coast — Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="studio">
  <section class="controls" aria-label="Cover controls">
    <h1>Neon Coast</h1>
    <p class="intro">Two photos, a painted Vice City dusk, one big title. Set the look, then take the PNG home.</p>

    <fieldset>
      <legend>Photos</legend>
      <label class="upload">First photo — the hero
        <input id="slot-a-file" type="file" accept="image/*">
      </label>
      <div class="sample-row">
        <button id="slot-a-pier" type="button">Pier sample</button>
        <button id="slot-a-boulevard" type="button">Boulevard sample</button>
      </div>
      <label class="upload">Second photo — fills the extra panels
        <input id="slot-b-file" type="file" accept="image/*">
      </label>
      <div class="sample-row">
        <button id="slot-b-pier" type="button">Pier sample</button>
        <button id="slot-b-boulevard" type="button">Boulevard sample</button>
      </div>
      <p class="tip">One photo covers every panel on its own. Add a second and the layouts mix the two. Your files stay on your machine — nothing is uploaded.</p>
    </fieldset>

    <fieldset>
      <legend>Words</legend>
      <label>Title
        <input id="title" type="text" maxlength="28" value="Neon Heat">
      </label>
      <label>Tagline
        <input id="tagline" type="text" maxlength="40" value="Sunset Run">
      </label>
    </fieldset>

    <fieldset>
      <legend>Look</legend>
      <div class="pick" role="group" aria-label="Panel layout">
        <label><input type="radio" name="layout" value="poster" checked> Poster</label>
        <label><input type="radio" name="layout" value="grid"> Four panels</label>
        <label><input type="radio" name="layout" value="strip"> Three strips</label>
      </div>
      <div class="pick" role="group" aria-label="Colour grade">
        <label><input type="radio" name="tone" value="sunset" checked> Sunset</label>
        <label><input type="radio" name="tone" value="neon"> Neon night</label>
        <label><input type="radio" name="tone" value="dawn"> Teal dawn</label>
      </div>
      <label>Post size
        <select id="size">
          <option value="square" selected>Square — 1080 x 1080</option>
          <option value="portrait">Portrait — 1080 x 1350</option>
          <option value="wide">Wide — 1920 x 1080</option>
        </select>
      </label>
    </fieldset>

    <fieldset>
      <legend>Frame each photo</legend>
      <label>First photo zoom
        <input id="zoom-a" type="range" min="1" max="2.5" step="0.05" value="1">
        <span id="zoom-a-value">Zoom 1.00x</span>
      </label>
      <label>First photo sideways
        <input id="panx-a" type="range" min="-1" max="1" step="0.05" value="0">
        <span id="panx-a-value">Pan 0.00</span>
      </label>
      <label>First photo up and down
        <input id="pany-a" type="range" min="-1" max="1" step="0.05" value="0">
        <span id="pany-a-value">Lift 0.00</span>
      </label>
      <label>Second photo zoom
        <input id="zoom-b" type="range" min="1" max="2.5" step="0.05" value="1">
        <span id="zoom-b-value">Zoom 1.00x</span>
      </label>
      <label>Second photo sideways
        <input id="panx-b" type="range" min="-1" max="1" step="0.05" value="0">
        <span id="panx-b-value">Pan 0.00</span>
      </label>
      <label>Second photo up and down
        <input id="pany-b" type="range" min="-1" max="1" step="0.05" value="0">
        <span id="pany-b-value">Lift 0.00</span>
      </label>
    </fieldset>

    <div class="actions">
      <button id="export" type="button">Download the cover PNG</button>
      <button id="clear" type="button">Clear photos</button>
    </div>
    <p id="size-note" role="status"></p>
    <p id="status" role="status"></p>
  </section>

  <section class="stage" aria-label="Cover preview">
    <canvas id="cover" width="1080" height="1080"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
